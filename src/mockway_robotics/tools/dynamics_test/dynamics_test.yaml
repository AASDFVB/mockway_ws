# Mockway Robot - Real-time Torque Compensation Configuration
# 实时力矩补偿控制系统配置文件

# CAN 通信配置
can:
  type: "socketcan"           # CAN适配器类型: socketcan 或 witmotion
  port: "can0"                # SocketCAN接口名，或维特USB-CAN串口号
  serial_baudrate: 921600     # 串口波特率（USB-CAN适配器通信）
  can_baudrate: 1000000       # CAN总线波特率

# 电机配置列表
motors:
  - id: 1                                    # 电机 CAN ID
    type: "DM_J4310_2EC"                    # 电机型号
    master_id: 0                            # 主机ID（反馈帧ID）
    direction: 1                            # 旋转方向: 1=正向(与关节同向), -1=反向(与关节反向)
    joint_index: 0                           # URDF关节索引: joint1=0
    position_offset: 0.0                     # 关节位置偏移: q_joint = q_motor * direction + position_offset
    max_torque: 2.0                          # 首次调试单关节最大补偿力矩(Nm)
    torque_scale: 1.0                        # 单关节补偿比例，会和全局torque_scale相乘
    description: "Joint 1 - Shoulder"       # 电机描述（可选）

  - id: 2
    type: "DM4340"
    master_id: 0
    direction: 1                            # 旋转方向: 1=正向(与关节同向), -1=反向(与关节反向)
    joint_index: 1                           # URDF关节索引: joint2=1
    position_offset: 0.0                     # 关节位置偏移: q_joint = q_motor * direction + position_offset
    max_torque: 6.0                          # 首次调试单关节最大补偿力矩(Nm)
    torque_scale: 1.8                        # 单关节补偿比例，会和全局torque_scale相乘
    description: "Joint 2 - Elbow"

  - id: 3
    type: "DM4340"
    master_id: 0
    direction: -1                           # 旋转方向: 1=正向(与关节同向), -1=反向(与关节反向)
    joint_index: 2                           # URDF关节索引: joint3=2
    position_offset: 0.0                     # 关节位置偏移: q_joint = q_motor * direction + position_offset
    max_torque: 2.0                          # 首次加入joint3时先保守限幅(Nm)
    torque_scale: 1.5                        # joint3当前会反弹，先单独降低补偿比例
    description: "Joint 3 - Forearm"

  - id: 4
    type: "DM_J4310_2EC"
    master_id: 0
    direction: 1
    joint_index: 3
    position_offset: 0.0
    max_torque: 1.5
    torque_scale: 4.0
    description: "Joint 4 - Wrist"

  - id: 5
    type: "DM_J4310_2EC"
    master_id: 0
    direction: 1
    joint_index: 4
    position_offset: 0.0
    max_torque: 1.5
    torque_scale: 1.5
    description: "Joint 5 - Wrist Roll"

  - id: 6
    type: "DM_J4310_2EC"
    master_id: 0
    direction: 1
    joint_index: 5
    position_offset: 0.0
    max_torque: 1.5
    torque_scale: 1.0
    description: "Joint 5 - Wrist yaw"

# 控制参数
control:
  rate: 200                          # 控制频率 (Hz)
  compensation_mode: "gravity"       # 补偿模式: "gravity", "full_dynamics", "none"
  torque_scale: 0.8           # 全局补偿比例；每个电机还会乘自己的torque_scale

  # MIT控制参数
  mit_params:
    kp: 0.0                          # 位置增益（纯力矩控制时设为0）
    kd: 0.08                         # 阻尼增益，首次实机测试建议保留一点阻尼

# 日志配置
logging:
  print_status_interval: 0.5         # 状态打印间隔（秒）
  verbose: false                     # 详细输出模式
